[project]
name = "mlforge-backend"
version = "1.0.0"
requires-python = "==3.11.*"

dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "uvicorn[standard]==0.30.1",
    "tensorflow==2.16.1",
    "numpy==1.26.4",
    "scikit-learn==1.4.2",
    "Pillow==10.3.0",
    "python-multipart==0.0.9",
    "aiofiles==23.2.1",
]

[tool.fastapi]
entrypoint = "backend.main:app"

[tool.setuptools.packages.find]
include = ["backend*"]